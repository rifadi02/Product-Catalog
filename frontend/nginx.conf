server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite content-hashes everything under /assets, so those filenames are immutable by
    # construction and can be cached hard.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the one file whose name never changes, so it must never be cached — otherwise
    # a browser keeps serving a stale document that references deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # React Router is in history mode: /products/42 is a client-side route with no file behind it.
    # Without this fallback every deep link and every refresh returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
