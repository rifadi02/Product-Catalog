name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first one's result irrelevant. Superseded runs are
# cancelled rather than left to finish and fight over the deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Derived from the repository, so no owner is hard-coded anywhere. GHCR requires lowercase paths;
  # each job normalizes before use.
  BACKEND_IMAGE: ${{ github.repository }}/catalog-api
  FRONTEND_IMAGE: ${{ github.repository }}/catalog-web

jobs:
  # ── Secret hygiene ─────────────────────────────────────────────────────────────────────────
  # The repository previously carried `App Config Dev/Stg/Prod.txt` with live credentials in
  # plaintext. They were deleted and the pattern added to .gitignore — but .gitignore only stops
  # the *accidental* add, and says nothing once a file is already tracked or is force-added. This
  # job is the part that actually fails a build, so the rule survives the person who remembers it.
  secrets:
    name: Check for committed secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Fail on tracked credential files
        run: |
          matches=$(git ls-files -z \
            | tr '\0' '\n' \
            | grep -E -i '(^|/)(App Config .*\.txt|\.env|.*\.env|secrets\.json|.*\.pfx|.*\.p12)$' \
            | grep -v -E '(^|/)\.env\.example$' || true)

          if [ -n "$matches" ]; then
            echo "::error::Credential-bearing files are tracked in git:"
            echo "$matches"
            echo "Delete them, and ROTATE the secrets at the source — untracking is not remediation."
            exit 1
          fi

          echo "No credential-bearing files are tracked."

  # ── Backend ────────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (.NET)
    # Gates on the secret check rather than running beside it: these jobs publish an image built
    # from the working tree, and a leaked credential must not reach a registry while the run that
    # would have caught it is still going. The check is a checkout and one `git ls-files`, so the
    # serialisation costs seconds.
    needs: [secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend
    outputs:
      image: ${{ steps.image-name.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The SDK is pinned to 10.0.204 (rollForward: latestPatch), and the .slnx solution
          # format needs >= 9.0.200 to build at all. Read the pin rather than restating it.
          global-json-file: backend/global.json

      # setup-dotnet's built-in `cache:` needs packages.lock.json files, which this repo does not
      # use, so the NuGet cache is managed directly.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Catalog.slnx

      # ReportGenerator, pinned in backend/.config/dotnet-tools.json so CI and a developer's
      # machine merge coverage with the same version.
      - name: Restore local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build Catalog.slnx --no-restore -c Release

      # Runs all three suites: unit, architecture, and the Testcontainers-backed integration tests.
      # ubuntu-latest has a Docker daemon, which the integration suite requires — its custom
      # DockerFactAttribute *skips* rather than fails when Docker is missing, so a container-less
      # runner would report green without having tested anything. Hence the .trx artifact below.
      - name: Test
        run: >
          dotnet test Catalog.slnx --no-build -c Release
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"

      # One coverage file per test project measures one slice of the solution: Domain and
      # Application from the unit suite, Api from the controller and middleware tests,
      # Infrastructure almost entirely from the Testcontainers suite. Merging them is what makes
      # the published figure a figure for the solution rather than for whichever report was read.
      - name: Merge coverage reports
        if: always()
        run: >
          dotnet reportgenerator
          "-reports:**/TestResults/**/coverage.cobertura.xml"
          "-targetdir:artifacts/coverage"
          "-reporttypes:Html;TextSummary;Cobertura;MarkdownSummaryGithub"
          "-verbosity:Warning"

      - name: Publish coverage summary
        if: always()
        run: cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/TestResults/**
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/artifacts/coverage
          if-no-files-found: warn

      # GHCR rejects uppercase in an image path, and github.repository preserves the owner's
      # casing. ${VAR,,} is a bash lowercase expansion.
      - name: Normalize image name
        id: image-name
        run: echo "value=${BACKEND_IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      # Build context is `backend/`, not the repo root — the Dockerfile's own header says so, and
      # it copies `src/…` paths relative to that. On PRs this still builds (so a broken Dockerfile
      # fails the PR) but does not push.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/src/Catalog.Api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ── Frontend ───────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (React)
    needs: [secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: frontend
    outputs:
      image: ${{ steps.image-name.outputs.value }}

    env:
      # .env is git-ignored, so without this Vite would inline `undefined` as the API base URL.
      # It must match the origin the deployed API allowlists (see docker-compose.deploy.yml).
      VITE_API_BASE_URL: http://localhost:8080/api/v1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # No engines field or .nvmrc in the repo; Vite 7 requires ^20.19 || >=22.12.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm test` is bare `vitest`, i.e. watch mode. test:run is the one-shot runner.
      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

      # See the backend job: GHCR image paths must be lowercase.
      - name: Normalize image name
        id: image-name
        run: echo "value=${FRONTEND_IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite bakes this into the bundle at build time; it cannot be changed at container start.
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Deploy ─────────────────────────────────────────────────────────────────────────────────
  # Runs on a self-hosted runner installed on the machine that owns the target Docker daemon —
  # a GitHub-hosted runner cannot reach a local daemon.
  deploy:
    name: Deploy to local Docker
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: local
    permissions:
      contents: read
      packages: read

    # Everything the compose file interpolates. Secrets are passed as environment variables and
    # never interpolated into a `run:` string, so they cannot leak into the step log.
    env:
      BACKEND_IMAGE: ${{ needs.backend.outputs.image }}
      FRONTEND_IMAGE: ${{ needs.frontend.outputs.image }}
      IMAGE_TAG: ${{ github.sha }}
      JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      COMPOSE_FILE: docker-compose.deploy.yml

    # bash for the health-poll loop. On a Windows self-hosted runner this resolves to the Git Bash
    # that ships with Git for Windows, which the runner already needs for checkout.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: docker compose pull

      - name: Start stack
        run: docker compose up -d --remove-orphans

      # Compose's own healthchecks gate container startup order; this gates the *job*, so a stack
      # that comes up broken fails the run instead of reporting a green deploy.
      - name: Wait for API to become ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:${API_PORT:-8080}/health/ready > /dev/null; then
              echo "API ready after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become ready within 60s."
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Verify SPA is served
        run: curl -fsS -o /dev/null "http://localhost:${WEB_PORT:-5173}/"

      - name: Prune superseded images
        if: always()
        run: docker image prune -f
